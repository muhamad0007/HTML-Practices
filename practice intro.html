<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice page</title>
</head>
<body bgcolor="majenda">
    

    <header>
        <h1>My HTML Practice Website</h1>
        <nav>
            <a href="#about">About Me</a> | 
            <a href="#skills">Skills</a> | 
            <a href="#contact">Contact</a>
        </nav>
    </header>
      <hr>
    <main>

        <section id="about">
            <h2>About Me</h2>
            <p>Hello! Im creative web developer.</p>
        </section>

    
        <section id="skills">
            <h2>My Skills</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>tailwind</li>
                <li>vite</li>
                <li>JavaScript</li>
            </ul>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <form action="#">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" placeholder="Apna naam likhein" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" placeholder="Apna email likhein" required><br><br>

                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 My Practice Page. All rights reserved.</p>
    </footer>

</body>
</html>
