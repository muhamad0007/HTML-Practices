<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payment form></form></title>
</head>
<body>
    <form action="">
        <h1>Payment form</h1>
        <p>required fields are followed by *</p>
        <h2> Contact information</h2>
        <p>Name: *<input type="text" name="name" required></p>
            <fieldset>
                <legend>Gender *</legend>
            Male <input type="radio" name="gender" id="Male" required>
            Female <input type="radio" name="gender" id="Female" required>
            Trans <input type="radio" name="gender" id="Trans">
            non binary<input type="radio" name="gender" id="non binary">
            gay <input type="radio" name="gender" id="gay">
        </p>
        </fieldset>
        <p>Address: <textarea name="address" id="address" cols="100" rows="5"></textarea></p>
        <p>Email: <input type="email" name="email" id="email"></p>
        <p>Pincode: <input type="number" name="Pincode" id="Pincode"></p>
        <hr>
        <h2> payment information</h2>
        <p>card type : 
            <select name="card_type" id="card_type">
                <option value=""> --select a card type--</option>
                <option value="visa">visa</option>
                <option value="rupay">rupay</option>
                <option value="master card">master card</option>
            </select>
        </p>
        <p>Card number <input type="number" name="card_number" id="card_number"></p>
        <p>Exp date <input type="date" name="exp_date" id="exp_date"></p>
        <p>CVV <input type="password" name="cvv" id="cvv"></p>
        <input type="submit" value="paynow">
    </form>
    
</body>
</html>
