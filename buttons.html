<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>button</title>
  <style>
    .subs-button{
      background-color:rgb(255 ,0, 0);
      color: white;
      width: 105px;
      height: 36px;;
      border-radius: 2px;
      border: none;
      cursor: pointer;
      margin-right: 8px;
      transition: opacity 0.15s ;
    }
    .subs-button:hover {
      opacity: 0.6; 
    }

    .join{
      background-color: white;
      border-color: rgb(41, 118, 211) ;
      border-style: solid;
      border-width: 1px;
      color: rgb(41, 118, 211);
      height: 36px;
      width: 62px;
      border-radius: 2px;
      cursor:pointer;
      transition: background-color 0.15s ,
       color 0.15s

    }
    .join:hover{
        background-color:rgb(41, 118, 211) ;
        color: white;
        opacity: 0.7;
    }

    .tweet-b{
      background-color:rgb(41, 118, 211) ;
      border: none;
      border-style: round;
      border-width: 1px;
      color: white;
      height: 36px;
      width: 70px;
      border-radius: 90px;
      cursor:pointer;
      margin-left: 8px;
      font-weight: bold;
      font-size: 15px;

    }
    .Amazon{
      background-color:rgb(255 ,216, 20);
      width: 100%;
      max-width: 250px;
      font-family: Arial, Helvetica, sans-serif;
      display: inline-block;
      height: 33px;
      border-radius: 90px;
      border: 1px solid #FCD200
      font-weight: 400;

    }

    .github{
      background-color:rgb(46 ,164,79) ;
      color: white;
      font-weight: bold;
      border: none;
      width: 80px;
      height:30px;
      border-radius: 7px;
      transition: box-shadow 0.15s;
      
    }
    .github:hover{
      box-shadow: 5px 5px 5px  rgba(0, 0, 0, 0.15);
    }

  </style>
</head>
<body>
  <p>
    button styles
  </p>
  
  <button class="subs-button">SUBSCRIBE</button>

  <button class="join"> JOIN</button>

  <button class="tweet-b">Tweet</button><br>
  <hr>

  <!-- Amazon add to cart button -->
   <button class="Amazon">Add to Cart</button><br><hr>
   <!-- GITHUB sign-up bitton -->
  <button class="github">Sign up</button>
</body>
</html>
