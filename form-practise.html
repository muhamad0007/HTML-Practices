<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Survey Form Practice</title>
    <style>
        /* Basic styling for presentation */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .options-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }
        .options-group label {
            font-weight: normal;
            margin-bottom: 0;
        }
        button {
            background-color: #007BFF;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Survey & Registration Form</h2>
    
    <!-- Form Wrapper -->
    <form action="#" method="POST">
        
        <!-- Text Input -->
        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <!-- Email Input -->
        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <!-- Password Field -->
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a secure password" required>
        </div>

        <!-- Dropdown Menu (<select>) -->
        <div class="form-group">
            <label for="role">Primary Role:</label>
            <select id="role" name="role">
                <option value="" disabled selected>Select your role</option>
                <option value="student">Student</option>
                <option value="developer">Web Developer</option>
                <option value="designer">Designer</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Radio Buttons -->
        <div class="form-group">
            <label>How satisfied are you with our website?</label>
            <div class="options-group">
                <label><input type="radio" name="satisfaction" value="yes"> Satisfied</label>
                <label><input type="radio" name="satisfaction" value="no"> Needs Work</label>
            </div>
        </div>

        <!-- Checkboxes -->
        <div class="form-group">
            <label>What languages do you want to learn? (Check all that apply)</label>
            <div class="options-group">
                <label><input type="checkbox" name="lang" value="html"> HTML</label>
                <label><input type="checkbox" name="lang" value="css"> CSS</label>
                <label><input type="checkbox" name="lang" value="js"> JS</label>
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit">Submit Form</button>

    </form>
</div>

</body>
</html>
